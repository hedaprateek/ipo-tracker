name: Check published website
on:
  workflow_dispatch:
  workflow_run:
    # GitHub's generated Pages workflow name differs from its run display title.
    workflows: ['pages-build-deployment']
    types: [completed]
  schedule:
    - cron: '23 * * * *'
permissions:
  contents: read
concurrency:
  group: check-published
  cancel-in-progress: false
jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify public assets, data schema and source freshness
        env:
          IPO_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: node scripts/check-published.cjs

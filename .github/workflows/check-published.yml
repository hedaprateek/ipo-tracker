name: Check published website
on:
  workflow_dispatch:
  workflow_run:
    # GitHub's generated Pages workflow name differs from its run display title.
    workflows: ['pages-build-deployment']
    types: [completed]
  schedule:
    - cron: '23 * * * *'
permissions:
  contents: read
  actions: write
concurrency:
  group: check-published
  cancel-in-progress: false
jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify public assets, data schema and source freshness
        id: public
        continue-on-error: true
        env:
          IPO_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: node scripts/check-published.cjs
      - name: Request recovery when scheduled updates have gone stale
        if: steps.public.outputs.refresh_needed == 'true' && github.event_name != 'workflow_run'
        uses: actions/github-script@v7
        with:
          script: |
            // Never dispatch from a deployment-triggered check: a provider
            // outage must not create a refresh/deploy/refresh loop.
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner, repo: context.repo.repo,
              workflow_id: 'fetch-data.yml', ref: 'main'
            });
            core.notice('Requested a source refresh because published data is stale.');
      - name: Report failed public verification
        if: steps.public.outcome == 'failure'
        run: exit 1

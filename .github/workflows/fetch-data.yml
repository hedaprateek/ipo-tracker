name: Fetch IPO data

# GitHub Pages serves files but cannot run server.js, so this fetches NSE and
# IPO Watch on a schedule and commits the JSON the page reads. Each run also
# appends to data/gmp-history.json, which is what builds the GMP trend.
on:
  schedule:
    # Every 30 minutes. GitHub queues cron jobs, so expect some drift.
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'scripts/**'
      - '.github/workflows/fetch-data.yml'

concurrency:
  group: fetch-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --omit=dev --no-audit --no-fund

      - name: Fetch NSE and GMP data
        run: node scripts/fetch-data.js

      # Only regenerates a report when an IPO's facts have materially changed,
      # so most runs make no API calls at all. Never fails the workflow: without
      # a key the script exits 0 and the rest of the data still publishes.
      - name: Generate apply/avoid reports
        env:
          # Whichever is set wins, Gemini first — it has a free tier.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IPO_LLM_PROVIDER: ${{ vars.IPO_LLM_PROVIDER }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: node scripts/generate-reports.js
        continue-on-error: true

      - name: Commit if changed
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          if git diff --staged --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "data: refresh $(date -u '+%Y-%m-%d %H:%M UTC')"
          # The schedule can overlap a manual push; rebase rather than fail.
          git pull --rebase --autostash origin main
          git push

name: Smoke test

# Loads every view in a real browser and fails on any console error.
#
# The bug this is for: opening an SME issue threw partway through building the
# detail dialog, leaving it open, half-empty and impossible to close. Nothing
# reported it — it was found by opening every issue by hand. This is meant to
# catch that class of bug on the commit that introduces it.
#
# NOT YET WORKING — manual trigger only, deliberately.
#
# Chrome writes the DOM and then does not exit. Every variation tried so far
# hangs: piped stdio, file redirection, Node's timeout option, and the shell's
# timeout binary, on Windows and on this runner alike. Until that is solved this
# must not run on push, because a check that hangs for hours is worse than no
# check at all. Run it by hand to work on it; the job cap below means a hang
# costs ten minutes rather than the six-hour default.
on:
  workflow_dispatch:

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # GitHub's Ubuntu image ships Chrome; this only pins where it is.
      - name: Locate Chrome
        run: echo "CHROME_PATH=$(which google-chrome || which chromium-browser)" >> "$GITHUB_ENV"

      - name: Load every view and fail on console errors
        run: node scripts/smoke.js

name: Check website
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['data/**', 'README.md']
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check pure calculations and parser fixtures
        run: node --test tests/*.test.cjs
      - name: Locate Chrome
        run: echo "CHROME_PATH=$(which google-chrome || which chromium-browser)" >> "$GITHUB_ENV"
      - name: Check browser flows with a bounded session
        run: node scripts/browser-check.cjs
